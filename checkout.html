<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - 章程's Shop</title>
    <link rel="icon" href="/images/zc-bag-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css?v=20260501-floating-header-light">
    <script src="/js/auth.js"></script>
    <style>
        .checkout-container { max-width: 700px; margin: 40px auto; padding: 30px; }
        .order-summary { background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
        .order-summary h2 { margin-top: 0; font-family: var(--font-serif); font-size: 1.45em; font-weight: 500; color: var(--text); }
        .order-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
        .order-item:last-child { border-bottom: none; }
        .order-total { display: flex; justify-content: space-between; padding: 15px 0 0; font-weight: 700; font-size: 1.2em; border-top: 2px solid var(--text); margin-top: 10px; }
        .checkout-btn { width: 100%; padding: 15px; background: var(--primary); color: #FFF8F1; border: none; border-radius: var(--radius-sm); font-size: 1.05em; cursor: pointer; margin-top: 20px; transition: background 0.2s, transform 0.2s; }
        .checkout-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .checkout-btn:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; transform: none; }
        .login-prompt { text-align: center; padding: 40px; background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius); }
        .login-prompt a { color: var(--primary); font-weight: 700; }
        #status-msg { text-align: center; margin-top: 15px; color: var(--text-secondary); font-size: 0.95em; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="brand" aria-label="章程's Shop home">
            <img class="site-logo-mark" src="/images/zc-bag-logo.svg" alt="">
            <span class="site-logo-text">章程<span class="accent">'s</span> Shop</span>
        </a>
        <div class="nav-right">
            <div id="auth-section"></div>
        </div>
    </nav>
    <div class="checkout-container">
        <div id="auth-check"></div>
        <div id="cart-check"></div>
        <div id="order-summary"></div>
        <div id="checkout-actions"></div>
        <div id="status-msg"></div>
    </div>
    <script>
        const API_BASE = window.shopAuth.API_BASE_URL;
        let currentSession = null;

        async function init() {
            currentSession = await window.shopAuth.loadCurrentUser();
            const cart = JSON.parse(localStorage.getItem('iems5718-cart') || '[]');

            if (!currentSession || !currentSession.authenticated) {
                document.getElementById('auth-check').innerHTML =
                    '<div class="login-prompt"><p>You need to <a href="/login.html">login</a> to checkout.</p></div>';
                return;
            }
            if (!cart || cart.length === 0) {
                document.getElementById('cart-check').innerHTML =
                    '<div class="login-prompt"><p>Your cart is empty. <a href="/index.html">Browse products</a></p></div>';
                return;
            }

            renderOrderSummary(cart);
            renderCheckoutActions(cart);
        }

        function renderOrderSummary(cart) {
            let html = '<div class="order-summary"><h2>Order Summary</h2>';
            cart.forEach(item => {
                html += '<div class="order-item"><span>' + escapeHtml(item.name) + ' x' + item.quantity +
                    '</span><span>$' + (item.price * item.quantity).toFixed(2) + '</span></div>';
            });
            const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
            html += '<div class="order-total"><span>Total</span><span>$' + total.toFixed(2) + '</span></div>';
            html += '</div>';
            document.getElementById('order-summary').innerHTML = html;
        }

        function renderCheckoutActions(cart) {
            document.getElementById('checkout-actions').innerHTML =
                '<button class="checkout-btn" id="checkout-btn" onclick="doCheckout()">Proceed to Checkout</button>';
        }

        function doCheckout() {
            const btn = document.getElementById('checkout-btn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            document.getElementById('status-msg').textContent = 'Creating secure order...';

            const cart = JSON.parse(localStorage.getItem('iems5718-cart') || '[]');
            const items = cart.map(item => ({ pid: item.id, quantity: item.quantity }));

            window.shopAuth.authFetch(API_BASE + '/checkout/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(items)
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('status-msg').textContent = 'Error: ' + data.error;
                    btn.disabled = false;
                    btn.textContent = 'Proceed to Checkout';
                    return;
                }

                localStorage.removeItem('iems5718-cart');

                if (data.useStripe && data.checkoutUrl) {
                    document.getElementById('status-msg').textContent = 'Redirecting to Stripe checkout...';
                    window.location.href = data.checkoutUrl;
                } else {
                    // Test mode: show success directly
                    window.location.href = 'checkout-success.html?order_id=' + data.orderId;
                }
            })
            .catch(err => {
                document.getElementById('status-msg').textContent = 'Network error: ' + err.message;
                btn.disabled = false;
                btn.textContent = 'Proceed to Checkout';
            });
        }

        function escapeHtml(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        init();
    </script>
</body>
</html>
