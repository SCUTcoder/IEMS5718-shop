<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:8080; form-action 'self'; base-uri 'self'; object-src 'none'">
    <title>Change Password - 章程's Shop</title>
    <link rel="icon" href="/images/zc-bag-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css?v=20260501-floating-header">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a href="/index.html" class="auth-logo" aria-label="章程's Shop home">
            <img src="/images/zc-shop-wordmark.svg" alt="章程's Shop">
        </a>
        <a href="/index.html" class="auth-back-link">Back to Shop</a>
        <h1>Change password</h1>
        <p>Your current password is required. After the change, the system signs you out and asks you to log in again.</p>
        <form class="auth-form" id="change-password-form">
            <div>
                <label for="current-password">Current Password</label>
                <input id="current-password" type="password" minlength="8" maxlength="72" autocomplete="current-password" required>
            </div>
            <div>
                <label for="new-password">New Password</label>
                <input id="new-password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
            </div>
            <div>
                <label for="confirm-password">Confirm New Password</label>
                <input id="confirm-password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
            </div>
            <button class="auth-submit" type="submit">Update Password</button>
            <div class="auth-message" id="auth-message"></div>
        </form>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        const form = document.getElementById('change-password-form');
        const messageEl = document.getElementById('auth-message');

        (async () => {
            const user = await shopAuth.loadCurrentUser();
            if (!user.authenticated) {
                window.location.href = '/login.html';
            }
        })();

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            messageEl.textContent = '';
            messageEl.className = 'auth-message';

            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                messageEl.textContent = 'Passwords do not match';
                messageEl.classList.add('error');
                return;
            }

            const response = await shopAuth.authFetch(`${shopAuth.API_BASE_URL}/auth/change-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentPassword, newPassword, confirmPassword })
            });

            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
                messageEl.textContent = body.message || 'Unable to change password';
                messageEl.classList.add('error');
                return;
            }

            messageEl.textContent = body.message || 'Password changed';
            messageEl.classList.add('success');
            setTimeout(() => { window.location.href = '/login.html'; }, 1200);
        });
    </script>
</body>
</html>
