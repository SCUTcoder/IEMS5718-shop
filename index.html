    <script src="/js/auth.js"></script>
    <script>
    const API_BASE_URL = shopAuth.API_BASE_URL;

    let cart = JSON.parse(localStorage.getItem('iems5718-cart')) || [];
    let productsData = {};
    let allProducts = [];
    let categories = [];
    let activeCategory = 'all';
    let searchQuery = '';

    // ── Infinite scroll state ──
    const PAGE_SIZE = 8;
    let filteredList = [];
    let loadedCount = 0;
    let scrollObserver = null;

    // ── SEO URL helpers ──
    function slug(str, fallback) {
        const value = (str || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        return value || fallback || 'item';
    }
    function normalizeAssetUrl(url) {
        const value = String(url || '').trim();
        if (!value) return '';
        if (/^(https?:|data:|blob:|\/)/i.test(value)) return value;
        return '/' + value.replace(/^\.?\//, '');
    }
    function splitMediaCsv(csv) {
        if (!csv) return [];
        return csv.split(',')
            .map(item => normalizeAssetUrl(item.trim()))
            .filter(Boolean);
    }
    function getProductImageSets(product) {
        const galleryImages = splitMediaCsv(product.galleryImageUrls);
        const thumbnailImages = splitMediaCsv(product.thumbnailUrls);
        const primaryImage = normalizeAssetUrl(product.imageUrl || product.thumbnailUrl || '');

        if (galleryImages.length > 0) {
            return {
                images: galleryImages,
                thumbnails: thumbnailImages.length === galleryImages.length ? thumbnailImages : galleryImages
            };
        }

        if (thumbnailImages.length > 0) {
            return {
                images: thumbnailImages,
                thumbnails: thumbnailImages
            };
        }

        return {
            images: primaryImage ? [primaryImage] : [],
            thumbnails: primaryImage ? [primaryImage] : []
        };
    }
    function getPrimaryImage(product) {
        const imageSet = getProductImageSets(product);
        return imageSet.thumbnails[0] || imageSet.images[0] || '';
    }
    function isLocal() {
        return window.location.hostname === 'localhost' ||
               window.location.hostname === '127.0.0.1' ||
               window.location.hostname === '';
    }
    function productUrl(product) {
        const pid     = product.pid || product.id;
        const catId   = product.category?.catid || product.catid || 0;
        const catName = product.category?.name  || '';
        if (isLocal()) return `product.html?id=${encodeURIComponent(pid)}`;
        return `/${catId}-${slug(catName, 'category')}/${pid}-${slug(product.name, 'product')}`;
    }
    function categoryUrl(cat) {
        if (isLocal()) return null; // handled client-side via activeCategory
        return `/${cat.catid}-${slug(cat.name, 'category')}/`;
    }

    // ==================== Init ====================
    document.addEventListener('DOMContentLoaded', async () => {
        await shopAuth.initializeHeaderAuth();
        await Promise.all([loadCategories(), loadProducts()]);
        updateCartDisplay();
        initCartToggle();
        initSearch();
        readUrlParams();
    });

    function readUrlParams() {
        const params = new URLSearchParams(window.location.search);
        let catid  = params.get('catid');
        if (!catid) {
            const pathMatch = window.location.pathname.match(/^\/([0-9]+)-[^/]*\/?$/);
            catid = pathMatch ? pathMatch[1] : null;
        }
        if (catid) {
            // Activate the matching category pill (set by nginx SEO URL rewrite)
            activeCategory = catid;
            document.querySelectorAll('.category-pill').forEach(btn => {
                btn.classList.toggle('active', String(btn.dataset.catid) === String(catid));
            });
            filterProducts();
        }
    }

    // ==================== Categories ====================
    async function loadCategories() {
        try {
            const res = await fetch(`${API_BASE_URL}/categories`);
            if (!res.ok) throw new Error('Failed');
            categories = await res.json();
            renderCategoryFilter();
        } catch (e) {
            categories = [
                { catid: 1, name: 'Electronics' },
                { catid: 2, name: 'Clothing' }
            ];
            renderCategoryFilter();
        }
    }

    function renderCategoryFilter() {
        const filter = document.getElementById('category-filter');
        filter.innerHTML = '<button class="category-pill active" data-catid="all">All</button>';
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'category-pill';
            btn.dataset.catid = cat.catid;
            // SEO URL for anchor link (production only); client-side handled by click
            const url = categoryUrl(cat);
            if (url) btn.dataset.seoUrl = url;
            btn.textContent = cat.name;
            filter.appendChild(btn);
        });

        filter.querySelectorAll('.category-pill').forEach(btn => {
            btn.addEventListener('click', () => {
                filter.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCategory = btn.dataset.catid;
                filterProducts();
            });
        });
    }

    function filterProducts() {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';

        // Disconnect any existing observer
        if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
        const oldSentinel = document.getElementById('scroll-sentinel');
        if (oldSentinel) oldSentinel.remove();

        let filtered = activeCategory === 'all'
            ? allProducts
            : allProducts.filter(p => {
                const catid = p.category ? (p.category.catid || p.category) : p.catid;
                return String(catid) === String(activeCategory);
            });

        filtered = [...filtered].sort((a, b) => (b.weight || 0) - (a.weight || 0) || (a.pid || 0) - (b.pid || 0));

        const q = searchQuery.trim().toLowerCase();
        if (q) {
            filtered = filtered.filter(p =>
                (p.name && p.name.toLowerCase().includes(q)) ||
                (p.description && p.description.toLowerCase().includes(q))
            );
        }

        // Update result count
        let countEl = document.getElementById('search-result-count');
        if (q) {
            if (!countEl) {
                countEl = document.createElement('div');
                countEl.id = 'search-result-count';
                countEl.className = 'search-result-count';
                document.querySelector('.products').insertAdjacentElement('beforebegin', countEl);
            }
            countEl.innerHTML = `Found <span>${filtered.length}</span> result${filtered.length !== 1 ? 's' : ''} for "${q}"`;
            countEl.style.display = '';
        } else if (countEl) {
            countEl.style.display = 'none';
        }

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="no-results"><div class="no-results-icon">🔍</div><p>${q ? 'No products match "' + q + '"' : 'No products found in this category'}</p></div>`;
            return;
        }

        // ── Infinite scroll: store result set and render first batch ──
        filteredList = filtered;
        loadedCount  = 0;
        renderNextBatch(grid, q);
        setupInfiniteScroll(grid, q);
    }

    function renderNextBatch(grid, q) {
        const end = Math.min(loadedCount + PAGE_SIZE, filteredList.length);
        for (let i = loadedCount; i < end; i++) {
            grid.appendChild(createProductCard(filteredList[i], q !== undefined ? q : searchQuery.trim().toLowerCase()));
        }
        loadedCount = end;
        initAddToCartButtons();
    }

    function setupInfiniteScroll(grid, q) {
        if (loadedCount >= filteredList.length) return; // all items visible already

        const sentinel = document.createElement('div');
        sentinel.id = 'scroll-sentinel';
        sentinel.innerHTML = '<div class="infinite-loading"><span></span><span></span><span></span></div>';
        document.querySelector('.products').insertAdjacentElement('afterend', sentinel);

        scrollObserver = new IntersectionObserver((entries) => {
            if (!entries[0].isIntersecting) return;
            renderNextBatch(grid, q);
            if (loadedCount >= filteredList.length) {
                scrollObserver.disconnect();
                scrollObserver = null;
                sentinel.remove();
            }
        }, { rootMargin: '300px' });

        scrollObserver.observe(sentinel);
    }

    // ==================== Products ====================
    async function loadProducts() {
        const grid = document.getElementById('product-grid');
        const apiStatus = document.getElementById('api-status');

        try {
            const res = await fetch(`${API_BASE_URL}/products`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            allProducts = await res.json();
        } catch (e) {
            apiStatus.classList.add('show');
            apiStatus.innerHTML = '<p class="error">Backend not available. Showing demo data.</p>';
            allProducts = [
                { pid: 1, name: 'Gaming Laptop', description: 'High-performance gaming laptop with latest specs', price: 1299.99, imageUrl: '/images/product1.jpg', category: { catid: 1, name: 'Electronics' } },
                { pid: 2, name: 'Wireless Headphones', description: 'Premium wireless headphones with noise cancellation', price: 249.99, imageUrl: '/images/product2.jpg', category: { catid: 1, name: 'Electronics' } },
                { pid: 3, name: 'Smart Watch', description: 'Latest smartwatch with health monitoring features', price: 399.99, imageUrl: '/images/product3.jpg', category: { catid: 1, name: 'Electronics' } },
                { pid: 4, name: 'Tablet PC', description: 'Portable tablet perfect for work and entertainment', price: 599.99, imageUrl: '/images/product4.jpg', category: { catid: 1, name: 'Electronics' } }
            ];
        }

        allProducts.forEach(p => {
            const id = p.pid || p.id;
            productsData[id] = p;
        });

        filterProducts();
    }

    function createProductCard(product, query) {
        const id = product.pid || product.id;
        const catName = product.category ? (product.category.name || product.category) : '';
        const safeName = escapeHtml(product.name || '');
        const safeDesc = escapeHtml(product.description || '');
        const safeCatName = escapeHtml(catName);
        const name = query ? highlightText(safeName, query) : safeName;
        const desc = query ? highlightText(safeDesc, query) : safeDesc;
        const primaryMedia = getPrimaryCardMedia(product);

        const href = productUrl(product);
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
            <a href="${escapeHtml(href)}" class="product-card-image">
                ${primaryMedia.type === 'video'
                    ? `<video src="${escapeHtml(primaryMedia.src)}" muted autoplay loop playsinline preload="metadata"></video>`
                    : `<img src="${escapeHtml(primaryMedia.src)}" alt="${safeName}" loading="lazy">`
                }
            </a>
            <div class="product-card-body">
                ${safeCatName ? `<div class="product-card-category">${safeCatName}</div>` : ''}
                <h3><a href="${escapeHtml(href)}">${name}</a></h3>
                <p class="product-card-desc">${desc}</p>
                <div class="product-card-footer">
                    <span class="price">$${product.price.toFixed(2)}</span>
                    <button class="add-to-cart-btn" data-product-id="${id}">
                        <span class="btn-text">Add to Cart</span>
                    </button>
                </div>
            </div>
        `;
        return card;
    }

    function getPrimaryCardMedia(product) {
        const video = normalizeAssetUrl(product.videoUrl || '');
        if (video) return { type: 'video', src: video };
        const image = getPrimaryImage(product);
        if (image) return { type: 'image', src: image };
        return {
            type: 'image',
            src: '/images/product1.jpg'
        };
    }

    function getCartItemMedia(product) {
        const image = getPrimaryImage(product);
        return {
            image,
            mediaType: image ? 'image' : (product.videoUrl ? 'video' : 'image')
        };
    }

    function highlightText(text, query) {
        if (!query || !text) return text;
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark class="highlight">$1</mark>');
    }

    function escapeHtml(value) {
        return shopAuth.escapeHtml(value);
    }

    function initAddToCartButtons() {
        document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const productId = parseInt(this.dataset.productId);
                addToCart(productId, this);
            });
        });
    }

    // ==================== Cart ====================
    function addToCart(productId, buttonEl) {
        const product = productsData[productId];
        if (!product) return;

        const cartProductId = product.pid || product.id;
        const existing = cart.find(item => item.id === cartProductId);
        if (existing) {
            existing.quantity += 1;
        } else {
            const media = getCartItemMedia(product);
            cart.push({
                id: cartProductId,
                name: product.name,
                price: product.price,
                image: media.image,
                mediaType: media.mediaType,
                quantity: 1
            });
        }

        localStorage.setItem('iems5718-cart', JSON.stringify(cart));
        updateCartDisplay();

        // Button feedback
        if (buttonEl) {
            buttonEl.classList.add('added');
            buttonEl.querySelector('.btn-text').textContent = '✓ Added';
            flyToCart(buttonEl);
            setTimeout(() => {
                buttonEl.classList.remove('added');
                buttonEl.querySelector('.btn-text').textContent = 'Add to Cart';
            }, 1200);
        }

        showNotification(`${product.name} added to cart!`);
    }

    function flyToCart(btnEl) {
        const btnRect = btnEl.getBoundingClientRect();
        const cartEl = document.getElementById('cart-count');
        const cartRect = cartEl.getBoundingClientRect();

        const flyEl = document.createElement('div');
        flyEl.className = 'fly-item';
        flyEl.textContent = '🛒';
        flyEl.style.left = btnRect.left + btnRect.width / 2 - 20 + 'px';
        flyEl.style.top = btnRect.top + btnRect.height / 2 - 20 + 'px';

        const dx = cartRect.left + cartRect.width / 2 - (btnRect.left + btnRect.width / 2);
        const dy = cartRect.top + cartRect.height / 2 - (btnRect.top + btnRect.height / 2);

        flyEl.style.setProperty('--fly-x', dx + 'px');
        flyEl.style.setProperty('--fly-y', dy + 'px');
        flyEl.style.setProperty('--fly-x-mid', dx * 0.4 + 'px');
        flyEl.style.setProperty('--fly-y-mid', (dy - 80) + 'px');
        flyEl.style.animation = 'flyToCart 0.65s cubic-bezier(0.2, 0, 0.38, 0.9) forwards';

        document.body.appendChild(flyEl);

        setTimeout(() => {
            flyEl.remove();
            cartEl.classList.add('bounce');
            setTimeout(() => cartEl.classList.remove('bounce'), 500);
        }, 650);
    }

    function removeFromCart(productId) {
        cart = cart.filter(item => item.id !== productId);
        localStorage.setItem('iems5718-cart', JSON.stringify(cart));
        updateCartDisplay();
    }

    function updateCartQuantity(productId, newQty) {
        const item = cart.find(item => String(item.id) === String(productId));
        if (item) {
            item.quantity = parseInt(newQty);
            if (item.quantity <= 0) {
                removeFromCart(productId);
            } else {
                localStorage.setItem('iems5718-cart', JSON.stringify(cart));
                updateCartDisplay();
            }
        }
    }

    function updateCartDisplay() {
        const countEl = document.getElementById('cart-count');
        const itemsEl = document.getElementById('cart-items');
        const checkoutBtn = document.getElementById('checkout-btn');
        if (!countEl || !itemsEl) return;

        let cartChanged = false;
        cart.forEach(item => {
            const product = productsData[String(item.id)] || productsData[item.id];
            if (!product) return;
            const media = getCartItemMedia(product);
            if (media.image && item.image !== media.image) {
                item.image = media.image;
                item.mediaType = 'image';
                cartChanged = true;
            }
        });
        if (cartChanged) {
            localStorage.setItem('iems5718-cart', JSON.stringify(cart));
        }

        const totalItems = cart.reduce((s, i) => s + i.quantity, 0);
        const totalAmount = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        countEl.textContent = totalItems;

        if (cart.length === 0) {
            itemsEl.innerHTML = '<p class="empty-cart">Your cart is empty</p>';
            if (checkoutBtn) checkoutBtn.disabled = true;
        } else {
            itemsEl.innerHTML = cart.map(item => `
                <div class="cart-item">
                    ${renderCartItemMedia(item)}
                    <div class="cart-item-details">
                        <h4>${escapeHtml(item.name)}</h4>
                        <span class="cart-item-price">$${item.price.toFixed(2)} × ${item.quantity}</span>
                        <input type="number" class="cart-item-quantity" value="${item.quantity}" min="1" data-product-id="${item.id}">
                    </div>
                    <button class="cart-item-remove" data-product-id="${item.id}">×</button>
                </div>
            `).join('') + `
                <div class="cart-total">
                    <strong>Total: $${totalAmount.toFixed(2)}</strong>
                </div>
            `;
            if (checkoutBtn) checkoutBtn.disabled = false;
            itemsEl.querySelectorAll('.cart-item-image').forEach(img => {
                img.addEventListener('error', () => {
                    img.replaceWith(createCartMediaFallback(img.dataset.mediaType));
                }, { once: true });
            });

            itemsEl.querySelectorAll('.cart-item-quantity').forEach(input => {
                input.addEventListener('change', function() {
                    updateCartQuantity(parseInt(this.dataset.productId), this.value);
                });
            });

            itemsEl.querySelectorAll('.cart-item-remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    removeFromCart(parseInt(this.dataset.productId));
                });
            });
        }
    }

    // ==================== Search ====================
    function initSearch() {
        const input = document.getElementById('search-input');
        const clearBtn = document.getElementById('search-clear');
        let debounceTimer;

        input.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            clearBtn.style.display = input.value ? '' : 'none';
            debounceTimer = setTimeout(() => {
                searchQuery = input.value;
                filterProducts();
            }, 200);
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            searchQuery = '';
            clearBtn.style.display = 'none';
            input.focus();
            filterProducts();
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                input.value = '';
                searchQuery = '';
                clearBtn.style.display = 'none';
                input.blur();
                filterProducts();
            }
        });
    }

    // ==================== UI Helpers ====================
    function initCartToggle() {
        const toggle = document.getElementById('cart-toggle');
        if (toggle) {
            toggle.addEventListener('click', (e) => {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                    toggle.parentElement.classList.toggle('active');
                }
            });
        }

        const checkoutBtn = document.getElementById('checkout-btn');
        if (checkoutBtn) {
            checkoutBtn.addEventListener('click', () => {
                window.location.href = '/checkout.html';
            });
        }
    }

    function showNotification(message) {
        shopAuth.showNotification(message);
    }

    function renderCartItemMedia(item) {
        const image = normalizeAssetUrl(item.image);
        if (!image) {
            return `<div class="cart-item-media cart-item-media-fallback">${item.mediaType === 'video' ? 'Video' : 'Image'}</div>`;
        }
        return `<img class="cart-item-image" src="${escapeHtml(image)}" alt="${escapeHtml(item.name)}" data-media-type="${escapeHtml(item.mediaType || 'image')}">`;
    }

    function createCartMediaFallback(mediaType) {
        const fallback = document.createElement('div');
        fallback.className = 'cart-item-media cart-item-media-fallback';
        fallback.textContent = mediaType === 'video' ? 'Video' : 'Image';
        return fallback;
    }
    </script>
</body>
</html>
