<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - 章程's Shop</title>
    <link rel="icon" href="/images/zc-bag-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css?v=20260501-floating-header">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a href="/index.html" class="auth-logo" aria-label="章程's Shop home">
            <img src="/images/zc-shop-wordmark.svg" alt="章程's Shop">
        </a>
        <a href="/index.html" class="auth-back-link">Back to Shop</a>
        <h1>Create account</h1>
        <p>Register with a unique email address. Password confirmation is checked on both the client and the server.</p>
        <form class="auth-form" id="register-form" novalidate>
            <div>
                <label for="display-name">Display Name</label>
                <input id="display-name" name="display-name" type="text" maxlength="80" autocomplete="name">
            </div>
            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="text" maxlength="255" autocomplete="email">
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" maxlength="72" autocomplete="new-password">
            </div>
            <div>
                <label for="confirm-password">Confirm Password</label>
                <input id="confirm-password" name="confirm-password" type="password" maxlength="72" autocomplete="new-password">
            </div>
            <button class="auth-submit" type="submit">Create Account</button>
            <div class="auth-message" id="auth-message"></div>
        </form>
        <p style="margin-top:18px;margin-bottom:0;">Already registered? <a href="/login.html">Login here</a>.</p>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        const form = document.getElementById('register-form');
        const messageEl = document.getElementById('auth-message');

        function showError(msg) {
            messageEl.textContent = msg;
            messageEl.className = 'auth-message error';
        }

        function isValidEmail(val) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            messageEl.textContent = '';
            messageEl.className = 'auth-message';

            const displayName     = document.getElementById('display-name').value.trim();
            const email           = document.getElementById('email').value.trim();
            const password        = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Client-side validation (all English)
            if (!displayName)               return showError('Display name is required.');
            if (!email)                     return showError('Email is required.');
            if (!isValidEmail(email))       return showError('Please enter a valid email address.');
            if (!password)                  return showError('Password is required.');
            if (password.length < 8)        return showError('Password must be at least 8 characters.');
            if (password !== confirmPassword) return showError('Passwords do not match.');

            try {
                const registerResponse = await shopAuth.authFetch(`${shopAuth.API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ displayName, email, password, confirmPassword })
                });
                const registerBody = await registerResponse.json().catch(() => ({}));
                if (!registerResponse.ok) {
                    return showError(registerBody.message || 'Unable to create account.');
                }

                const loginResponse = await shopAuth.authFetch(`${shopAuth.API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (!loginResponse.ok) {
                    return showError('Account created. Please login with your new account.');
                }
                shopAuth.clearLocalSession();
            } catch (error) {
                const result = shopAuth.localRegister(displayName, email, password);
                if (!result.ok) {
                    return showError(result.message);
                }
            }

            messageEl.textContent = 'Account created! Redirecting to shop...';
            messageEl.className = 'auth-message success';
            setTimeout(() => { window.location.href = '/index.html'; }, 800);
        });
    </script>
</body>
</html>
