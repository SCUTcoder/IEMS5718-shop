server {
    listen 80;
    server_name s14.iems5718.iecuhk.cc;

    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name s14.iems5718.iecuhk.cc;

    ssl_certificate /etc/letsencrypt/live/s14.iems5718.iecuhk.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s14.iems5718.iecuhk.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;
    root /var/www/html;
    index index.html;

    location = /admin {
        try_files /admin.html =404;
    }

    # ── SEO URLs (Phase 6) ───────────────────────────────────────────────
    # /catId-catName/productId-productName  →  product.html?id=productId
    location ~ ^/([0-9]+)-[^/]+/([0-9]+)-[^/]+/?$ {
        rewrite ^/([0-9]+)-[^/]+/([0-9]+)-[^/]+/?$ /product.html?id=$2 last;
    }
    # /catId-catName/  →  index.html?catid=catId
    location ~ ^/([0-9]+)-[^/]+/?$ {
        rewrite ^/([0-9]+)-[^/]+/?$ /index.html?catid=$1 last;
    }
    # ────────────────────────────────────────────────────────────────────

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
