<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:8080; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Product - 章程's Shop</title>
    <link rel="stylesheet" href="/css/style.css?v=20260426-paths">
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <a href="/index.html" class="logo">章程's Shop</a>
            <ul class="nav-links">
                <li><a href="/index.html">Home</a></li>
            </ul>
            <div class="header-actions">
                <div class="user-chip" id="header-user-name"><small>Signed in as</small> Guest</div>
                <a href="/admin.html" class="header-link-btn" id="admin-link" style="display:none;">Admin</a>
                <a href="/change-password.html" class="header-link-btn" id="change-password-link" style="display:none;">Password</a>
                <a href="/login.html" class="header-link-btn" id="login-link">Login</a>
                <a href="/register.html" class="header-link-btn primary" id="register-link">Register</a>
                <button type="button" class="header-link-btn" id="logout-btn" style="display:none;">Logout</button>
                <div class="cart-container">
                    <div class="cart-icon" id="cart-toggle">
                        🛒 <span class="cart-count" id="cart-count">0</span>
                    </div>
                    <div class="cart-dropdown">
                        <div class="cart-dropdown-header">Shopping Cart</div>
                        <div class="cart-items" id="cart-items">
                            <p class="empty-cart">Your cart is empty</p>
                        </div>
                        <div class="cart-dropdown-footer">
                            <button class="checkout-btn" id="checkout-btn" disabled>Checkout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="breadcrumb-bar" id="breadcrumb">
        <a href="/index.html">Home</a> &gt; <span>Loading...</span>
    </div>

    <main>
        <section class="product-detail" id="product-detail">
            <div style="text-align: center; padding: 60px; grid-column: 1/-1;">
                <p style="color: var(--text-secondary);">Loading product details...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 IEMS5718 Shop by 章程. All rights reserved.</p>
    </footer>

    <script src="/js/auth.js"></script>
    <script src="/js/script.js?v=20260427-video-first"></script>
</body>
</html>
