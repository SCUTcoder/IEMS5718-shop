<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product - 章程's Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <a href="index.html" class="logo">章程's Shop</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
            <div class="cart-container">
                <div class="cart-icon" id="cart-toggle">
                    🛒 <span class="cart-count" id="cart-count">0</span>
                </div>
                <div class="cart-dropdown">
                    <div class="cart-dropdown-header">Shopping Cart</div>
                    <div class="cart-items" id="cart-items">
                        <p class="empty-cart">Your cart is empty</p>
                    </div>
                    <div class="cart-dropdown-footer">
                        <button class="checkout-btn" id="checkout-btn" disabled>Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="breadcrumb-bar" id="breadcrumb">
        <a href="index.html">Home</a> &gt; <span>Loading...</span>
    </div>

    <main>
        <section class="product-detail" id="product-detail">
            <div style="text-align: center; padding: 60px; grid-column: 1/-1;">
                <p style="color: var(--text-secondary);">Loading product details...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 IEMS5718 Shop by 章程. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
