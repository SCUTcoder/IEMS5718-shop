<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 章程's Shop</title>
    <link rel="stylesheet" href="/css/style.css?v=20260426-paths">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a href="/index.html" class="auth-back-link">Back to Shop</a>
        <h1>Welcome back</h1>
        <p>Sign in to manage products, change your password, or continue as a registered shopper.</p>
        <form class="auth-form" id="login-form" novalidate>
            <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="text" maxlength="255" autocomplete="email">
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" maxlength="72" autocomplete="current-password">
            </div>
            <button class="auth-submit" type="submit">Login</button>
            <div class="auth-message" id="auth-message"></div>
        </form>
        <p style="margin-top:18px;margin-bottom:0;">No account yet? <a href="/register.html">Create one here</a>.</p>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const messageEl = document.getElementById('auth-message');

        function showError(msg) {
            messageEl.textContent = msg;
            messageEl.className = 'auth-message error';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            messageEl.textContent = '';
            messageEl.className = 'auth-message';

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email)    return showError('Email is required.');
            if (!password) return showError('Password is required.');

            try {
                const response = await shopAuth.authFetch(`${shopAuth.API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) {
                    return showError(body.message || 'Incorrect email or password.');
                }
                shopAuth.clearLocalSession();
            } catch (error) {
                const result = shopAuth.localLogin(email, password);
                if (!result.ok) {
                    return showError('Unable to reach the backend, and no local account matched.');
                }
            }

            const redirect = new URLSearchParams(window.location.search).get('redirect');
            const safeRedirect = redirect && !redirect.startsWith('http') && !redirect.startsWith('//')
                ? redirect
                : '/index.html';

            messageEl.textContent = 'Login successful. Redirecting...';
            messageEl.className = 'auth-message success';
            setTimeout(() => { window.location.href = safeRedirect; }, 600);
        });
    </script>
</body>
</html>
