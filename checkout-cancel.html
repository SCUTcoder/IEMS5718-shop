<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Cancelled - Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cancel-container { max-width: 600px; margin: 60px auto; text-align: center; padding: 40px; }
        .cancel-icon { font-size: 4em; color: #e74c3c; margin-bottom: 20px; }
        .back-btn { display: inline-block; margin-top: 24px; padding: 12px 30px; background: #3498db; color: white; text-decoration: none; border-radius: 8px; }
        .back-btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <nav class="navbar"><a href="index.html" class="brand">&#x1F6D2; SecureShop</a></nav>
    <div class="cancel-container">
        <div class="cancel-icon">&#x274C;</div>
        <h1>Checkout Cancelled</h1>
        <p>Your checkout was cancelled. Your cart items have been saved.</p>
        <a href="checkout.html" class="back-btn">Try Again</a>
        <a href="index.html" class="back-btn" style="background:#95a5a6;margin-left:10px">Back to Shop</a>
    </div>
</body>
</html>
