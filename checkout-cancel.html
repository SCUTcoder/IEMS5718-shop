<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Cancelled - 章程's Shop</title>
    <link rel="icon" href="/images/zc-bag-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css?v=20260501-brand-logo">
    <style>
        .cancel-container { max-width: 600px; margin: 60px auto; text-align: center; padding: 40px; }
        .cancel-container h1 { font-family: var(--font-serif); font-weight: 500; }
        .cancel-icon { font-size: 4em; color: var(--danger); margin-bottom: 20px; }
        .back-btn { display: inline-block; margin-top: 24px; padding: 12px 30px; background: var(--primary); color: #FFF8F1; text-decoration: none; border-radius: var(--radius-sm); }
        .back-btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="brand" aria-label="章程's Shop home">
            <img class="site-logo-mark" src="/images/zc-bag-logo.svg" alt="">
            <span class="site-logo-text">章程<span class="accent">'s</span> Shop</span>
        </a>
    </nav>
    <div class="cancel-container">
        <div class="cancel-icon">&#x274C;</div>
        <h1>Checkout Cancelled</h1>
        <p>Your checkout was cancelled. Your cart items have been saved.</p>
        <a href="/checkout.html" class="back-btn">Try Again</a>
        <a href="/index.html" class="back-btn" style="background:var(--ink);margin-left:10px">Back to Shop</a>
    </div>
</body>
</html>
